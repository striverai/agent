name: Deploy GoClaw to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            echo "Deploying GoClaw on VPS..."
            cd /opt/goclaw
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.yml -f docker-compose.postgres.yml build goclaw
            docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d
            docker compose -f docker-compose.yml -f docker-compose.postgres.yml -f docker-compose.upgrade.yml run --rm upgrade
            echo "Waiting for GoClaw to become healthy..."
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:18795/health > /dev/null; then
                echo "GoClaw is healthy!"
                exit 0
              fi
              sleep 2
            done
            echo "Healthcheck timed out!"
            docker compose -f docker-compose.yml -f docker-compose.postgres.yml logs --tail 50 goclaw
            exit 1
